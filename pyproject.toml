[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trawa-billing-agent"
version = "0.1.0"
description = "Monthly energy billing run with master-data checks, a review agent and human approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "mcp>=1.2",
    "pandas>=2.2",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
billing-agent = "billing_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The customer table is easier to read with one customer per line.
"src/billing_agent/generate.py" = ["E501"]
